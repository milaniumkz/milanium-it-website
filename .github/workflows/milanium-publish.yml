name: Connect milanium.kz only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: milanium-vps
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: milanium-production
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm public DNS before touching the server
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host = "milanium.kz"
          ips={x[4][0] for x in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)}
          if ips != {"89.126.192.185"}:
              raise SystemExit(f"DNS for {host} must resolve only to the shared VPS; resolved: {sorted(ips)}")
          print("Public DNS points to the intended VPS.")
          PY
      - name: Publish exact static bundle and verify neighbor services
        env:
          SSHPASS: ${{ secrets.MILANIUM_VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          command -v sshpass >/dev/null
          bundle=deploy/milanium-kz-static.zip
          digest=51ef030d85788477900b2dc08dc86e161584780e04302e578c953bbb1d20a0ee
          printf '%s  %s\n' "$digest" "$bundle" | sha256sum --check --status
          bash -n deploy/publish-initial.sh
          umask 077
          hostkey="$(mktemp)"
          trap 'rm -f "$hostkey"' EXIT
          printf '%s\n' '89.126.192.185 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDY8hkshZ0Nhs9jOJzO1aYdJqf2UjZHqpvlnAKDV552G' > "$hostkey"
          target=(sshpass -e ssh -F /dev/null -o ConnectTimeout=12 -o NumberOfPasswordPrompts=1
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$hostkey"
            -o HostKeyAlgorithms=ssh-ed25519 -o PubkeyAuthentication=no -o PreferredAuthentications=password
            root@89.126.192.185)
          file="$("${target[@]}" 'umask 077; mktemp /tmp/milanium.release.XXXXXXXXXX')"
          [[ "$file" =~ ^/tmp/milanium\.release\.[A-Za-z0-9]{10}$ ]]
          if ! "${target[@]}" "cat > '$file'" < "$bundle"; then
            "${target[@]}" "rm -f -- '$file'" || true; exit 1
          fi
          "${target[@]}" "bash -s -- '$file' '$digest'" < deploy/publish-initial.sh
      - name: Verify HTTPS externally
        shell: bash
        run: |
          set -euo pipefail
          f="$(mktemp)"
          trap 'rm -f "$f"' EXIT
          curl -fsS --retry 2 --max-time 15 https://milanium.kz/ > "$f"
          grep -q 'MILANIUM' "$f"
          grep -q 'rel="canonical" href="https://milanium.kz' "$f"
          grep -q 'name="robots" content="index, follow"' "$f"
          grep -Fq "Работаем по Казахстану, России и другим странам СНГ" "$f"
          grep -Fq "Разработка приложений и сайтов в Казахстане и России | MILANIUM" "$f"
          curl -fsS https://milanium.kz/robots.txt | grep -Fx 'Sitemap: https://milanium.kz/sitemap.xml'
          curl -fsS https://milanium.kz/sitemap.xml | grep -F '<loc>https://milanium.kz/</loc>'
          curl -fsS --max-time 15 -o /dev/null https://milanium.89.126.192.185.sslip.io/
          curl -fsS --max-time 15 -o /dev/null https://mtaxi.89.126.192.185.sslip.io/
          curl -fsS --max-time 15 -o /dev/null https://mbusiness.89.126.192.185.sslip.io:8443/
